<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Serial console wiring of the Vimar K40955 monitor</title>
  <desc id="d">Back of the monitor with the three console pads GND, TX and RX just above the cable connection, wired to a 3.3 volt USB serial adapter: GND to GND, monitor TX to adapter RXD, monitor RX to adapter TXD. The adapter's power pin stays unconnected.</desc>
  <rect width="920" height="500" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="919" height="499" fill="none" stroke="#d0d7de"/>

  <!-- ============ monitor, seen from behind ============ -->
  <text x="40" y="38" font-size="17" font-weight="600" fill="#1f2328">Monitor, seen from behind</text>
  <rect x="40" y="54" width="400" height="346" rx="18" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="60" y="70" width="46" height="12" rx="6" fill="#d0d7de"/>
  <rect x="374" y="70" width="46" height="12" rx="6" fill="#d0d7de"/>
  <rect x="60" y="372" width="46" height="12" rx="6" fill="#d0d7de"/>
  <rect x="374" y="372" width="46" height="12" rx="6" fill="#d0d7de"/>

  <!-- the console pads -->
  <rect x="140" y="156" width="200" height="104" rx="6" fill="#dff3e4" stroke="#1a7f37" stroke-width="2"/>
  <g stroke="#8c6d1f" stroke-width="3" fill="#ffffff">
    <circle cx="195" cy="184" r="10"/>
    <circle cx="240" cy="184" r="10"/>
    <circle cx="285" cy="184" r="10"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">
    <text x="195" y="218">GND</text>
    <text x="240" y="218">TX</text>
    <text x="285" y="218">RX</text>
  </g>
  <text x="240" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#1a7f37">console pads, 1.27 mm apart</text>

  <!-- cable connection below the pads -->
  <rect x="160" y="290" width="160" height="56" rx="5" fill="#eaeef2" stroke="#57606a" stroke-width="2"/>
  <g fill="#ffffff" stroke="#57606a" stroke-width="2">
    <circle cx="205" cy="318" r="13"/>
    <circle cx="275" cy="318" r="13"/>
  </g>
  <g stroke="#57606a" stroke-width="2">
    <line x1="197" y1="310" x2="213" y2="326"/>
    <line x1="267" y1="310" x2="283" y2="326"/>
  </g>
  <text x="240" y="368" font-size="14" text-anchor="middle" fill="#1f2328">cable connection (door bus)</text>
  <!-- "just above" hint -->
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <line x1="122" y1="318" x2="122" y2="268"/>
    <polyline points="116,278 122,266 128,278"/>
  </g>
  <text x="112" y="298" font-size="13" fill="#57606a" text-anchor="end">just</text>
  <text x="112" y="314" font-size="13" fill="#57606a" text-anchor="end">above</text>

  <!-- ============ USB-serial adapter ============ -->
  <text x="640" y="38" font-size="17" font-weight="600" fill="#1f2328">USB-serial adapter (3.3 V)</text>
  <rect x="640" y="120" width="170" height="210" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="810" y="190" width="70" height="70" rx="4" fill="#d0d7de" stroke="#57606a" stroke-width="2"/>
  <text x="845" y="230" font-size="13" text-anchor="middle" fill="#1f2328">USB</text>
  <text x="845" y="278" font-size="13" text-anchor="middle" fill="#57606a">to the PC</text>
  <g font-size="15" font-weight="600" fill="#1f2328">
    <text x="672" y="165">GND</text>
    <text x="672" y="215">RXD</text>
    <text x="672" y="265">TXD</text>
    <text x="672" y="315" fill="#57606a">VCC / 3V3 / 5V</text>
  </g>

  <!-- ============ the three wires ============ -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M195 174 V100 H580 V160 H645" stroke="#1f2328"/>
    <path d="M240 174 V118 H545 V210 H645" stroke="#0969da"/>
    <path d="M285 174 V136 H510 V260 H645" stroke="#bc4c00" stroke-dasharray="10 7"/>
  </g>
  <g stroke="#57606a" stroke-width="2" fill="#ffffff">
    <circle cx="652" cy="160" r="7"/>
    <circle cx="652" cy="210" r="7"/>
    <circle cx="652" cy="260" r="7"/>
    <circle cx="652" cy="310" r="7"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="end">
    <text x="632" y="182" fill="#1f2328">GND – GND</text>
    <text x="632" y="232" fill="#0969da">TX → RXD</text>
    <text x="632" y="282" fill="#bc4c00">RX ← TXD</text>
  </g>

  <!-- not connected -->
  <g stroke="#cf222e" stroke-width="3" stroke-linecap="round">
    <line x1="612" y1="301" x2="630" y2="319"/>
    <line x1="630" y1="301" x2="612" y2="319"/>
  </g>
  <text x="725" y="352" font-size="13" font-weight="600" fill="#cf222e" text-anchor="middle">power pin: leave unconnected</text>

  <!-- ============ rules ============ -->
  <rect x="40" y="418" width="840" height="64" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="56" y="443" font-size="14" fill="#1f2328"><tspan font-weight="600">Three wires only.</tspan> TX and RX cross over. Adapter set to 3.3 V. Never connect the adapter's power pin.</text>
  <text x="56" y="467" font-size="14" fill="#1f2328">Terminal: 115200 baud, 8N1, no flow control. Drawing not to scale: follow the labels printed on the board.</text>
</svg>
