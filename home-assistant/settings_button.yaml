# Settings button for the Vimar doorbell: a cog that opens a pop-up with the settings of the package.
# Needs the browser_mod integration (HACS). Add it as a card (Edit dashboard -> Add card -> Manual, paste).
# After the first restart set the values once: a new number starts at its minimum, a new switch starts off.
type: button
icon: mdi:cog-outline
icon_height: 40px
show_icon: true
show_name: false
tap_action:
  action: fire-dom-event
  browser_mod:
    service: browser_mod.popup
    data:
      size: small
      content:
        type: vertical-stack
        cards:
          - type: entities
            title: Doorbell settings
            show_header_toggle: false
            entities:
              - entity: input_boolean.vimar_save_pictures
                name: Save a picture at every ring
              - entity: input_number.vimar_keep_weeks
                name: Keep pictures for (weeks)
              - type: button
                name: Saved pictures
                icon: mdi:folder-image
                action_name: Open
                tap_action:
                  action: navigate
                  # Media -> Local media -> vimar. If it opens the wrong place, browse to the folder
                  # once and paste here the part of the address after the host name.
                  navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source%2Flocal%2Fvimar
              - entity: input_number.vimar_notify_minutes
                name: Ring notification stays (minutes)
              - entity: input_boolean.vimar_video_hq
                name: High quality video (not connected yet)
              - entity: input_boolean.vimar_picture_hq
                name: High quality pictures (not connected yet)
